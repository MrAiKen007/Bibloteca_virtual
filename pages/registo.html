<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — BIBLIO</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="auth-page">
<div class="card auth-card">
<a href="./catalogo.html" class="block text-center font-display text-3xl font-bold tracking-wider">BIBLIO</a>
<h1 class="mt-6 text-center text-2xl font-display">Criar conta</h1>
<form id="reg-form" class="mt-6 space-y-4">
<div><label class="label">Nome completo</label><input type="text" class="input" id="name" required></div>
<div><label class="label">E-mail</label><input type="email" class="input" id="email" required></div>
<div><label class="label">Palavra-passe</label><input type="password" class="input" id="pwd" required></div>
<div><label class="label">Confirmar palavra-passe</label><input type="password" class="input" id="pwd2" required></div>
<button type="submit" class="btn btn-w-full">Criar conta</button>
<p class="text-center text-sm text-muted">Já tem conta? <a href="./login.html" class="text-primary" style="text-decoration:underline;">Iniciar sessão</a></p>
</form>
</div>
</div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
document.getElementById("reg-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const pwd = document.getElementById("pwd").value;
    const pwd2 = document.getElementById("pwd2").value;

    if(pwd !== pwd2){
        toast("As palavras-passe não coincidem","error");
        return;
    }

    try {
        await register(name, email, pwd);
        toast("Conta criada com sucesso!");
        setTimeout(() => { location.href="./catalogo.html"; }, 1500);
    } catch (err) {
        // O erro já é tratado pelo toast dentro da função register() no app.js
    }
});
</script>
</body>
</html>
