<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor — BIBLIO</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .reader-layout { display: flex; flex-direction: column; height: 100vh; background: #1a1a1a; }
  .reader-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: #111; border-bottom: 1px solid #333; color: #f2f2f2; flex-shrink: 0; flex-wrap: wrap; gap: 0.5rem; }
  .reader-header .book-title { font-family: var(--ds-font-serif); font-size: 0.875rem; font-weight: 700; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-header .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; min-height: 44px; border-radius: 6px; border: 1px solid #444; background: transparent; color: #f2f2f2; cursor: pointer; font-size: 0.8125rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
  .reader-header .back-btn:hover { border-color: var(--ds-primary); color: var(--ds-primary); }
  .reader-spacer { width: 100px; }
  @media (min-width: 640px) {
    .reader-header { padding: 0.75rem 1.5rem; }
    .reader-header .book-title { font-size: 1rem; max-width: none; }
    .reader-spacer { display: block; }
  }
  .reader-body { flex: 1; overflow: hidden; }
  .reader-body iframe { width: 100%; height: 100%; border: none; }
  .reader-error { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #f2f2f2; text-align: center; padding: 2rem; }
  .reader-error h2 { font-family: var(--ds-font-serif); font-size: 1.5rem; margin-bottom: 0.5rem; }
  .reader-error p { color: #888; margin-bottom: 1.5rem; }
  .reader-error .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 8px; border: 1px solid #444; background: transparent; color: #f2f2f2; cursor: pointer; font-size: 0.875rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
  .reader-error .back-btn:hover { border-color: var(--ds-primary); color: var(--ds-primary); }
</style>
</head>
<body>
<div class="reader-layout" id="reader">
  <div class="reader-header">
    <a href="./biblioteca.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Voltar
    </a>
    <span class="book-title" id="book-title">A carregar...</span>
    <div class="reader-spacer"></div>
  </div>
  <div class="reader-body" id="reader-body"></div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js?v=202605212046"></script>
<script>
async function loadReader(){
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    if (!id) { showError("Livro não especificado"); return; }

    try {
        const res = await fetch(apiUrl(`livro?id=${id}`));
        if (!res.ok) { showError("Livro não encontrado"); return; }
        const data = await res.json();
        const book = data.dados;

        document.getElementById("book-title").textContent = book.titulo || "Sem título";

        if (!book.caminho_pdf) {
            showError("Este livro não tem PDF disponível para leitura online.");
            return;
        }

        const pdfUrl = apiUrl(`livro/pdf?id=${id}`);
        document.getElementById("reader-body").innerHTML = `<iframe src="${pdfUrl}" title="${book.titulo}" allowfullscreen></iframe>`;
    } catch (err) {
        showError("Erro ao carregar o livro. Verifique a sua ligação.");
    }
}

function showError(msg){
    document.getElementById("book-title").textContent = "Erro";
    document.getElementById("reader-body").innerHTML = `
        <div class="reader-error">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            <h2>Indisponível</h2>
            <p>${msg}</p>
            <a href="./biblioteca.html" class="back-btn">Voltar à biblioteca</a>
        </div>`;
}

document.addEventListener("DOMContentLoaded", loadReader);
</script>
</body>
</html>
