<!DOCTYPE html>
<html lang="pt">
<head>

<title>Recuperar senha — BIBLIO</title>

</head>
<body>
<div class="auth-page">
<div class="card auth-card">

</div>

<script src="../js/app.js?v=202605272031"></script>
<script>
document.getElementById("form").addEventListener("submit",function(e){e.preventDefault();toast("Email enviado! Verifique a sua caixa de entrada.");});
</script>
</body>
</html>
