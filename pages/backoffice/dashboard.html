<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backoffice — BIBLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
<style>
  :root {
    --ds-primary: #e84848;
    --ds-primary-hover: #c93535;
    --ds-primary-subtle: oklch(0.93 0.02 25);
    --ds-bg: #f6f5f4;
    --ds-text: #1a1a1a;
    --ds-text-muted: #7a7a7a;
    --ds-border: #e5e3e0;
    --ds-white: #ffffff;
    --ds-sidebar: #1a1a1a;
    --ds-font-serif: 'Playfair Display', serif;
    --ds-font-sans: 'Inter', sans-serif;
    --ds-green: oklch(0.62 0.14 145);
    --ds-green-subtle: oklch(0.94 0.025 145);
    --ds-amber: oklch(0.78 0.14 75);
    --ds-amber-subtle: oklch(0.95 0.025 75);
    --ds-blue: oklch(0.62 0.14 230);
    --ds-blue-subtle: oklch(0.94 0.025 230);
  }

  body { background-color: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-sans); -webkit-font-smoothing: antialiased; }

  .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  .sidebar { background: var(--ds-sidebar); padding: 1.75rem 0.875rem; display: flex; flex-direction: column; color: var(--ds-sidebar-text); position: sticky; top: 0; height: 100vh; }
  .sidebar-header { display: flex; align-items: center; gap: 0.625rem; padding: 0 0.75rem 2rem; }
  .sidebar-logo { font-family: var(--ds-font-serif); font-weight: 700; letter-spacing: 0.06em; font-size: 1.125rem; color: #ffffff; }
  .sidebar-nav a { display: flex; align-items: center; gap: 0.625rem; padding: 0.625rem 0.75rem; border-radius: 6px; color: #ffffff; font-weight: 500; text-decoration: none; transition: all 0.15s; margin-bottom: 0.125rem; font-size: 0.8125rem; }
  .sidebar-nav a:hover { background: rgba(255,255,255,0.06); color: #ffffff; }
  .sidebar-nav a.active { background: rgba(232,72,72,0.12); color: var(--ds-primary); }
  .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }

  .main-content { padding: 2.5rem 3rem; max-width: 1200px; }

  .page-header { margin-bottom: 2.5rem; }
  .page-header h1 { font-family: var(--ds-font-serif); font-size: 1.75rem; font-weight: 800; margin-bottom: 0.375rem; }
  .page-header p { color: var(--ds-text-muted); font-size: 0.875rem; }

  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }

  .metric { background: var(--ds-white); border: 1px solid var(--ds-border); border-radius: 8px; padding: 1.25rem 1.5rem; }
  .metric-label { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ds-text-muted); margin-bottom: 0.625rem; }
  .metric-value { font-family: var(--ds-font-serif); font-size: 1.875rem; font-weight: 700; line-height: 1; }
  .metric-context { font-size: 0.75rem; color: var(--ds-text-muted); margin-top: 0.5rem; }

  .section { margin-bottom: 2rem; }
  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; }
  .section-header h2 { font-family: var(--ds-font-serif); font-size: 1.125rem; font-weight: 700; }
  .section-header a { font-size: 0.8125rem; font-weight: 600; color: var(--ds-primary); text-decoration: none; }
  .section-header a:hover { text-decoration: underline; }

  .card { background: var(--ds-white); border: 1px solid var(--ds-border); border-radius: 8px; overflow: hidden; }

  .book-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--ds-border); transition: background 0.15s; }
  .book-row:last-child { border-bottom: none; }
  .book-row:hover { background: oklch(0.985 0.003 75); }
  .book-thumb { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-weight: 600; font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-author { font-size: 0.75rem; color: var(--ds-text-muted); margin-top: 0.125rem; }
  .book-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem; }
  .book-date { font-size: 0.6875rem; color: var(--ds-text-muted); }

  .badge { display: inline-flex; align-items: center; padding: 0.1875rem 0.5rem; border-radius: 4px; font-size: 0.6875rem; font-weight: 600; }
  .badge.green { background: var(--ds-green-subtle); color: var(--ds-green); }
  .badge.amber { background: var(--ds-amber-subtle); color: var(--ds-amber); }
  .badge.blue { background: var(--ds-blue-subtle); color: var(--ds-blue); }
  .badge.red { background: var(--ds-primary-subtle); color: var(--ds-primary); }

  .action-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .action-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1.25rem; border-radius: 6px; font-size: 0.8125rem; font-weight: 600; text-decoration: none; transition: all 0.15s; border: 1px solid var(--ds-border); background: var(--ds-white); color: var(--ds-text); }
  .action-btn:hover { border-color: var(--ds-primary); color: var(--ds-primary); }
  .action-btn.primary { background: var(--ds-primary); color: white; border-color: var(--ds-primary); }
  .action-btn.primary:hover { background: var(--ds-primary-hover); }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.375rem; }
  .status-dot.green { background: var(--ds-green); }
  .status-dot.amber { background: var(--ds-amber); }

  .mobile-header { display: none; align-items: center; justify-content: space-between; padding: 0.875rem 1rem; background: var(--ds-white); border-bottom: 1px solid var(--ds-border); position: sticky; top: 0; z-index: 40; }
  .mobile-header .logo { font-family: var(--ds-font-serif); font-size: 1.125rem; font-weight: 800; letter-spacing: 0.08em; }
  .mobile-toggle { width: 36px; height: 36px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mobile-toggle svg { width: 20px; height: 20px; }
  .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 49; display: none; }
  .mobile-overlay.open { display: block; }

  @media (max-width: 900px) {
    .main-content { padding: 1.5rem; }
    .metrics-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .admin-layout { grid-template-columns: 1fr; }
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 50; transform: translateX(-100%); transition: transform 0.25s ease; }
    .sidebar.open { transform: translateX(0); }
    .mobile-header { display: flex; }
    .main-content { padding: 1rem; }
    .page-header h1 { font-size: 1.375rem; }
    .metrics-row { grid-template-columns: 1fr; }
    .metric { padding: 1rem; }
    .metric-value { font-size: 1.5rem; }
    .action-row { flex-direction: column; }
    .action-btn { justify-content: center; }
    .book-row { padding: 0.75rem; }
    .book-thumb { width: 32px; height: 44px; }
  }
</style>
</head>
<body>

<div class="mobile-header">
  <span class="logo">BIBLIO</span>
  <button class="mobile-toggle" onclick="toggleMobileSidebar()" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
  </button>
</div>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMobileSidebar()"></div>

<div class="admin-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-primary)" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <div class="sidebar-logo">BIBLIO</div>
  </div>
  <nav class="sidebar-nav">
    <a href="./dashboard.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
    <a href="./livros.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg> Livros</a>
    <a href="./autores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Autores</a>
    <a href="./editoras.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3l2-4h14l2 4"/></svg> Editoras</a>
    <a href="./taxonomias.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10h10V2z"/><path d="M12 12H2v10h10V12z"/><path d="M22 2h-10v10h10V2z"/><path d="M22 12h-10v10h10V12z"/></svg> Géneros & Tags</a>
  </nav>
  <div class="sidebar-footer" id="sidebar-footer"></div>
</aside>

<main class="main-content">
  <div class="page-header">
    <h1>Gestão de Catálogo</h1>
    <p id="greeting">Bem-vindo, <span id="user-name">Operador</span>.</p>
  </div>

  <div class="action-row">
    <a href="./livros.html" class="action-btn primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14m-7-7v14"/></svg>
      Adicionar Livro
    </a>
    <a href="./autores.html" class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Gerir Autores
    </a>
    <a href="./taxonomias.html" class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10h10V2z"/><path d="M12 12H2v10h10V12z"/></svg>
      Géneros & Tags
    </a>
    <a href="../catalogo.html" class="action-btn" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
      Ver Site
    </a>
  </div>

  <section class="metrics-row">
    <div class="metric">
      <div class="metric-label">Livros Totais</div>
      <div id="stat-books" class="metric-value">-</div>
      <div class="metric-context" id="stat-books-context"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Publicados</div>
      <div id="stat-published" class="metric-value">-</div>
      <div class="metric-context" id="stat-published-context"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Rascunhos</div>
      <div id="stat-drafts" class="metric-value">-</div>
      <div class="metric-context" id="stat-drafts-context"></div>
    </div>
    <div class="metric">
      <div class="metric-label">Vendas Mês</div>
      <div id="stat-sales" class="metric-value">-</div>
      <div class="metric-context" id="stat-sales-context"></div>
    </div>
  </section>

  <div class="section">
    <div class="section-header">
      <h2>Livros Recentes</h2>
      <a href="./livros.html">Ver todos</a>
    </div>
    <div class="card" id="recent-books-list">
      <div class="p-12 text-center text-ds-text-muted">A carregar livros...</div>
    </div>
  </div>
</main>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/app.js?v=202605272031"></script>
<script>
function toggleMobileSidebar(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobile-overlay').classList.toggle('open');
}

function renderSidebar(){
    const el=document.getElementById("sidebar-footer");
    if(!el)return;
    el.innerHTML=`<div style="padding:0.75rem"><div class="flex items-center gap-2.5 mb-3"><div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center border border-gray-700 flex-shrink-0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,242,0.6)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="overflow-hidden"><div class="text-xs font-bold truncate" style="color:#ffffff">${currentUser?.name||'Backoffice'}</div><div class="text-xs truncate" style="color:rgba(255,255,255,0.5)">${currentUser?.email||''}</div></div></div><a href="../catalogo.html" class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider hover:text-white transition mb-3" style="text-decoration:none;color:rgba(255,255,255,0.5)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg> Voltar ao site</a><button onclick="logout()" class="w-full flex items-center justify-center gap-1.5 p-2 rounded-md bg-red-950 text-red-400 text-xs font-bold uppercase tracking-wider hover:bg-red-900 transition border border-red-900"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Sair</button></div>`;
}

function statusBadge(status) {
    if (status === 'publicado') return '<span class="badge green">publicado</span>';
    if (status === 'rascunho') return '<span class="badge amber">rascunho</span>';
    if (status === 'arquivado') return '<span class="badge blue">arquivado</span>';
    return `<span class="badge">${status}</span>`;
}

function render(){
    if(!currentUser) return;
    document.getElementById("user-name").innerText = currentUser.name;

    const total = books.length;
    const publicados = books.filter(b => b.status === "publicado").length;
    const rascunhos = books.filter(b => b.status === "rascunho" || !b.status).length;
    const vendasMes = orders.reduce((s, o) => s + (parseFloat(o.total) || 0), 0);

    document.getElementById("stat-books").innerText = total;
    document.getElementById("stat-books-context").innerHTML = `${books.filter(b => b.status !== 'arquivado').length} ativos no catálogo`;

    document.getElementById("stat-published").innerText = publicados;
    document.getElementById("stat-published-context").innerHTML = total > 0 ? `${Math.round((publicados/total)*100)}% do total` : '';

    document.getElementById("stat-drafts").innerText = rascunhos;
    document.getElementById("stat-drafts-context").innerHTML = rascunhos > 0 ? `<span class="status-dot amber"></span>Pendentes de revisão` : `<span class="status-dot green"></span>Nada pendente`;

    document.getElementById("stat-sales").innerText = formatAOA(vendasMes);
    document.getElementById("stat-sales-context").innerHTML = `${orders.length} pedido${orders.length !== 1 ? 's' : ''}`;

    const recent = [...books].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8);
    const activityEl = document.getElementById("recent-books-list");

    if (recent.length === 0) {
        activityEl.innerHTML = '<div class="p-12 text-center text-ds-text-muted">Nenhum livro registado.</div>';
        return;
    }

    activityEl.innerHTML = recent.map(b => `
      <div class="book-row">
        <img src="${b.cover}" class="book-thumb" alt="${b.title}" onerror="this.src='https://picsum.photos/seed/${b.id}/80/112'">
        <div class="book-info">
          <div class="book-title">${b.title}</div>
          <div class="book-author">${getAuthor(b.authorId).name}</div>
          <div class="book-meta">
            ${statusBadge(b.status)}
            <span class="book-date">${formatDate(b.createdAt)}</span>
          </div>
        </div>
      </div>
    `).join('');
}

document.addEventListener("DOMContentLoaded",()=>{
    renderSidebar();
    render();
});
</script>
</body>
</html>
