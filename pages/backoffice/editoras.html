<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editoras — Backoffice — BIBLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
<style>
  :root {
    --ds-primary: #e84848; --ds-primary-hover: #c93535; --ds-primary-subtle: oklch(0.93 0.02 25);
    --ds-bg: #f6f5f4; --ds-text: #1a1a1a; --ds-text-muted: #7a7a7a; --ds-border: #e5e3e0;
    --ds-white: #ffffff; --ds-sidebar: #1a1a1a;
    --ds-font-serif: 'Playfair Display', serif; --ds-font-sans: 'Inter', sans-serif;
    --ds-green: oklch(0.62 0.14 145); --ds-green-subtle: oklch(0.94 0.025 145);
    --ds-amber: oklch(0.78 0.14 75); --ds-amber-subtle: oklch(0.95 0.025 75);
  }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-sans); -webkit-font-smoothing: antialiased; }
  .admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--ds-sidebar); padding: 1.75rem 0.875rem; display: flex; flex-direction: column; color: var(--ds-sidebar-text); position: sticky; top: 0; height: 100vh; }
  .sidebar-header { display: flex; align-items: center; gap: 0.625rem; padding: 0 0.75rem 2rem; }
  .sidebar-logo { font-family: var(--ds-font-serif); font-weight: 700; letter-spacing: 0.06em; font-size: 1.125rem; color: #ffffff; }
  .sidebar-nav a { display: flex; align-items: center; gap: 0.625rem; padding: 0.625rem 0.75rem; border-radius: 6px; color: #ffffff; font-weight: 500; text-decoration: none; transition: all 0.15s; margin-bottom: 0.125rem; font-size: 0.8125rem; }
  .sidebar-nav a:hover { background: rgba(255,255,255,0.06); color: #ffffff; }
  .sidebar-nav a.active { background: rgba(232,72,72,0.12); color: var(--ds-primary); }
  .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .main-content { padding: 2.5rem 3rem; max-width: 1200px; }
  .page-header { margin-bottom: 2rem; }
  .page-header h1 { font-family: var(--ds-font-serif); font-size: 1.75rem; font-weight: 800; margin-bottom: 0.375rem; }
  .page-header p { color: var(--ds-text-muted); font-size: 0.875rem; }
  .action-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .action-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1.25rem; border-radius: 6px; font-size: 0.8125rem; font-weight: 600; text-decoration: none; transition: all 0.15s; border: 1px solid var(--ds-border); background: var(--ds-white); color: var(--ds-text); cursor: pointer; }
  .action-btn:hover { border-color: var(--ds-primary); color: var(--ds-primary); }
  .action-btn.primary { background: var(--ds-primary); color: white; border-color: var(--ds-primary); }
  .action-btn.primary:hover { background: var(--ds-primary-hover); }
  .card { background: var(--ds-white); border: 1px solid var(--ds-border); border-radius: 8px; overflow: hidden; }
  .activity-table { width: 100%; border-collapse: collapse; }
  .activity-table th { text-align: left; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ds-text-muted); padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--ds-border); background: var(--ds-bg); }
  .activity-table td { padding: 0.875rem 1.25rem; font-size: 0.8125rem; border-bottom: 1px solid var(--ds-border); vertical-align: middle; }
  .activity-table tr:last-child td { border-bottom: none; }
  .activity-table tr:hover td { background: oklch(0.985 0.003 75); }
  .publisher-icon { width: 32px; height: 32px; border-radius: 6px; background: var(--ds-primary-subtle); border: 1px solid var(--ds-border); display: inline-flex; align-items: center; justify-content: center; color: var(--ds-primary); flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; padding: 0.1875rem 0.5rem; border-radius: 4px; font-size: 0.6875rem; font-weight: 600; }
  .badge.green { background: var(--ds-green-subtle); color: var(--ds-green); }
  .badge.amber { background: var(--ds-amber-subtle); color: var(--ds-amber); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; background: transparent; border: 1px solid var(--ds-border); color: var(--ds-text-muted); transition: all 0.15s; cursor: pointer; }
  .icon-btn:hover { color: var(--ds-primary); border-color: var(--ds-primary); background: var(--ds-bg); }
  .icon-btn.danger:hover { color: #dc2626; border-color: #dc2626; background: #fef2f2; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--ds-white); border-radius: 10px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--ds-border); }
  .modal-header h2 { font-family: var(--ds-font-serif); font-size: 1.125rem; font-weight: 700; }
  .modal-close { width: 30px; height: 30px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ds-text-muted); transition: all 0.15s; }
  .modal-close:hover { background: var(--ds-bg); color: var(--ds-text); }
  .modal-body { padding: 1.75rem; }
  .form-group { margin-bottom: 1.125rem; }
  .form-label { display: block; font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ds-text-muted); margin-bottom: 0.375rem; }
  .form-input { width: 100%; padding: 0.625rem 0.875rem; border-radius: 6px; border: 1px solid var(--ds-border); font-size: 0.8125rem; outline: none; transition: all 0.15s; font-family: var(--ds-font-sans); }
  .form-input:focus { border-color: var(--ds-primary); box-shadow: 0 0 0 3px rgba(232,72,72,0.06); }
  .form-actions { display: flex; gap: 0.75rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--ds-border); margin-top: 1.25rem; }
  .btn-cancel { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--ds-border); background: transparent; color: var(--ds-text-muted); font-weight: 600; font-size: 0.8125rem; cursor: pointer; transition: all 0.15s; }
  .btn-cancel:hover { background: var(--ds-bg); color: var(--ds-text); }
  .btn-save { padding: 0.5rem 1.25rem; border-radius: 6px; border: none; background: var(--ds-primary); color: white; font-weight: 600; font-size: 0.8125rem; cursor: pointer; transition: all 0.15s; }
  .btn-save:hover { background: var(--ds-primary-hover); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .mobile-header { display: none; align-items: center; justify-content: space-between; padding: 0.875rem 1rem; background: var(--ds-white); border-bottom: 1px solid var(--ds-border); position: sticky; top: 0; z-index: 40; }
  .mobile-header .logo { font-family: var(--ds-font-serif); font-size: 1.125rem; font-weight: 800; letter-spacing: 0.08em; }
  .mobile-toggle { width: 36px; height: 36px; border-radius: 6px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mobile-toggle svg { width: 20px; height: 20px; }
  .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 49; display: none; }
  .mobile-overlay.open { display: block; }
  @media (max-width: 900px) { .main-content { padding: 1.5rem; } }
  @media (max-width: 640px) {
    .admin-layout { grid-template-columns: 1fr; }
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 50; transform: translateX(-100%); transition: transform 0.25s ease; }
    .sidebar.open { transform: translateX(0); }
    .mobile-header { display: flex; }
    .main-content { padding: 1rem; }
    .page-header h1 { font-size: 1.375rem; }
    .action-row { flex-direction: column; }
    .action-btn { justify-content: center; }
    .modal { max-width: 100%; margin: 0.75rem; border-radius: 10px 10px 0 0; align-self: flex-end; }
    .modal-header { padding: 1.125rem 1.25rem; }
    .modal-body { padding: 1.25rem; }
    .form-actions { flex-direction: column; }
    .form-actions .btn-cancel, .form-actions .btn-save { width: 100%; text-align: center; justify-content: center; }
  }
</style>
</head>
<body>
<div class="mobile-header">
  <span class="logo">BIBLIO</span>
  <button class="mobile-toggle" onclick="toggleMobileSidebar()" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
  </button>
</div>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMobileSidebar()"></div>

<div class="admin-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ds-primary)" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <div class="sidebar-logo">BIBLIO</div>
  </div>
  <nav class="sidebar-nav">
    <a href="./dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
    <a href="./livros.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg> Livros</a>
    <a href="./autores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Autores</a>
    <a href="./editoras.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3l2-4h14l2 4"/></svg> Editoras</a>
    <a href="./taxonomias.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10h10V2z"/><path d="M12 12H2v10h10V12z"/><path d="M22 2h-10v10h10V2z"/><path d="M22 12h-10v10h10V12z"/></svg> Géneros & Tags</a>
  </nav>
  <div class="sidebar-footer" id="sidebar-footer"></div>
</aside>

<main class="main-content">
  <div class="page-header">
    <h1>Editoras</h1>
    <p>Gestão de editoras e parceiros de publicação.</p>
  </div>

  <div class="action-row">
    <button class="action-btn primary" onclick="openPublisherModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14m-7-7v14"/></svg>
      Adicionar Editora
    </button>
  </div>

  <div class="card">
    <div class="table-wrapper">
    <table class="activity-table">
      <thead><tr><th style="width:60px;">Ícone</th><th>Nome</th><th>País</th><th>Livros</th><th class="text-right">Ações</th></tr></thead>
      <tbody id="publishers-table-body"></tbody>
    </table>
    </div>
  </div>
</main>
</div>

<div class="modal-overlay" id="publisher-modal" onclick="if(event.target===this)closePublisherModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nova Editora</h2>
      <button class="modal-close" onclick="closePublisherModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="publisher-form" onsubmit="handlePublisherSubmit(event)">
        <input type="hidden" name="id" id="publisher-id">
        <div class="form-group">
          <label class="form-label">Nome *</label>
          <input type="text" name="nome" id="publisher-nome" class="form-input" required placeholder="Ex: Porto Editora">
        </div>
        <div class="form-group">
          <label class="form-label">País</label>
          <input type="text" name="pais" id="publisher-pais" class="form-input" placeholder="Ex: Portugal">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closePublisherModal()">Cancelar</button>
          <button type="submit" class="btn-save" id="publisher-submit-btn">Guardar Editora</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/app.js?v=202605272031"></script>
<script>
function toggleMobileSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mobile-overlay').classList.toggle('open'); }
function renderSidebar(){
    const el=document.getElementById("sidebar-footer");
    if(!el)return;
    el.innerHTML=`<div style="padding:0.75rem"><div class="flex items-center gap-2.5 mb-3"><div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center border border-gray-700 flex-shrink-0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(242,242,242,0.6)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="overflow-hidden"><div class="text-xs font-bold truncate" style="color:#ffffff">${currentUser?.name||'Operador'}</div><div class="text-xs truncate" style="color:rgba(255,255,255,0.5)">${currentUser?.email||''}</div></div></div><button onclick="logout()" class="w-full flex items-center justify-center gap-1.5 p-2 rounded-md bg-red-950 text-red-400 text-xs font-bold uppercase tracking-wider hover:bg-red-900 transition border border-red-900"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Sair</button></div>`;
}
let editingPublisherId = null;
function openPublisherModal(publisher = null){
    editingPublisherId = publisher ? publisher.id : null;
    document.getElementById('publisher-id').value = publisher ? publisher.id : '';
    document.getElementById('publisher-nome').value = publisher ? (publisher.name || publisher.nome || '') : '';
    document.getElementById('publisher-pais').value = publisher ? (publisher.country || publisher.pais || '') : '';
    document.getElementById('modal-title').textContent = publisher ? 'Editar Editora' : 'Nova Editora';
    document.getElementById('publisher-submit-btn').textContent = publisher ? 'Atualizar Editora' : 'Guardar Editora';
    document.getElementById('publisher-modal').classList.add('open');
}
function closePublisherModal(){ document.getElementById('publisher-modal').classList.remove('open'); editingPublisherId = null; }
async function handlePublisherSubmit(e){
    e.preventDefault();
    const btn = document.getElementById('publisher-submit-btn');
    btn.disabled = true; btn.textContent = 'A guardar...';
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    try {
        let result;
        if (editingPublisherId) {
            result = await apiFetch('editoras/atualizar', { method: 'POST', body: { ...data, id: editingPublisherId } });
            if (result.sucesso) { toast('Editora atualizada com sucesso!'); closePublisherModal(); await fetchEditoras(); render(); }
            else toast(result.mensagem || 'Erro ao atualizar editora', 'error');
        } else {
            result = await apiFetch('editoras/guardar', { method: 'POST', body: data });
            if (result.sucesso) { toast('Editora adicionada com sucesso!'); closePublisherModal(); await fetchEditoras(); render(); }
            else toast(result.mensagem || 'Erro ao adicionar editora', 'error');
        }
    } catch (err) { toast('Erro de ligação', 'error'); }
    btn.disabled = false; btn.textContent = editingPublisherId ? 'Atualizar Editora' : 'Guardar Editora';
}
async function handleDeletePublisher(id){
    if (!confirm('Eliminar esta editora?')) return;
    try {
        const result = await apiFetch(`editoras/eliminar?id=${id}`, { method: 'DELETE' });
        if (result.sucesso) { toast('Editora eliminada'); await fetchEditoras(); render(); }
        else toast(result.mensagem || 'Erro ao eliminar', 'error');
    } catch (err) { toast('Erro de ligação', 'error'); }
}
function render(){
    const tbody = document.getElementById("publishers-table-body");
    if (publishers.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-ds-text-muted" style="padding:3rem;">Nenhuma editora registada.</td></tr>'; return; }
    tbody.innerHTML = publishers.map(p => {
        const bookCount = books.filter(b => String(b.publisherId) === String(p.id)).length;
        const initial = (p.name || p.nome || 'E').charAt(0).toUpperCase();
        return `<tr>
        <td><div class="publisher-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3l2-4h14l2 4"/></svg></div></td>
        <td><div class="font-bold">${p.name || p.nome}</div></td>
        <td class="text-ds-text-muted">${p.country || p.pais || '---'}</td>
        <td><span class="badge green">${bookCount}</span></td>
        <td class="text-right"><div class="flex justify-end gap-1.5">
          <button class="icon-btn" onclick='openPublisherModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' title="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
          <button class="icon-btn danger" onclick="handleDeletePublisher(${p.id})" title="Eliminar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div></td></tr>`;
    }).join("");
}
document.addEventListener("DOMContentLoaded", async ()=>{
    renderSidebar();
    await Promise.all([fetchEditoras(), fetchBooks()]);
    render();
});
</script>
</body>
</html>
