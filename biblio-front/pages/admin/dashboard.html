<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — BIBLIO</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
<div class="sidebar-header"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><div class="sidebar-logo">BIBLIO</div><span class="text-xs uppercase text-muted">Admin</span></div>
<nav class="sidebar-nav">
<a href="./dashboard.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
<a href="./utilizadores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Utilizadores</a>
<a href="./relatorios.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg> Relatórios</a>
</nav>
<div class="sidebar-footer" id="sidebar-footer"></div>
</aside>
<main class="main-content"><div class="p-6" id="main"></div></main>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/app.js"></script>
<script>
function renderSidebar(){
const el=document.getElementById("sidebar-footer");
if(!el)return;
el.innerHTML=`<div class="sidebar-user"><img src="${currentUser?.avatar||''}" class="sidebar-user-avatar" onerror="this.style.display='none'"><div><div class="text-xs font-medium truncate">${currentUser?.name||''}</div><div class="text-xs text-muted truncate">${currentUser?.email||''}</div></div></div><a href="../catalogo.html" class="sidebar-nav" style="padding:0.25rem 0.5rem;margin-bottom:0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Voltar ao site</a><a href="#" class="sidebar-nav" style="padding:0.25rem 0.5rem;" onclick="handleLogout();return false;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Terminar sessão</a>`;
}
function render(){
const pendentes=users.filter(u=>u.role==="backoffice"&&!u.active);
const totalVendas=orders.reduce((s,o)=>s+o.total,0);
document.getElementById("main").innerHTML=`<div class="space-y-6"><div><h1 class="font-display text-3xl font-bold">Dashboard Admin</h1><p class="text-sm text-muted">Visão geral da plataforma</p></div><div class="grid md-grid-cols-2 lg-grid-cols-4" style="gap:1rem;"><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Utilizadores</div><div class="mt-2 font-display text-3xl font-bold">${users.length}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Clientes ativos</div><div class="mt-2 font-display text-3xl font-bold">${users.filter(u=>u.role==="cliente"&&u.active).length}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Vendas acumuladas</div><div class="mt-2 font-display text-3xl font-bold">${formatEUR(totalVendas)}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Livros</div><div class="mt-2 font-display text-3xl font-bold">${books.length}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h10"/><path d="M6 20h12"/><path d="M6 16h12"/><path d="M5 2h14"/><path d="M6 2v18"/><path d="M18 2v18"/></svg></div></div></div></div><div class="grid lg-grid-cols-2" style="gap:1.5rem;"><div class="card card-p-5"><h3 class="mb-3 font-semibold">Vendas por mês</h3><div style="height:260px;display:flex;align-items:flex-end;gap:8px;padding-top:20px;">${salesByMonth.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;background:var(--primary);border-radius:4px 4px 0 0;height:${(s.vendas/3500)*220}px;"></div><span class="text-xs text-muted">${s.month}</span></div>`).join("")}</div></div><div class="card card-p-5"><h3 class="mb-3 font-semibold">Livros mais comprados</h3><div style="height:260px;display:flex;align-items:flex-end;gap:8px;padding-top:20px;">${topSelling.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;background:var(--primary);border-radius:4px 4px 0 0;height:${(s.vendas/120)*220}px;"></div><span class="text-xs text-muted truncate" style="max-width:100%;text-align:center;">${s.titulo}</span></div>`).join("")}</div></div></div><div class="card card-p-5"><h3 class="mb-3 font-semibold">Aprovações pendentes (${pendentes.length})</h3>${pendentes.length===0?`<p class="text-sm text-muted">Sem aprovações pendentes.</p>`:`<div class="space-y-2">${pendentes.map(u=>`<div class="flex items-center gap-3 rounded border p-3"><img src="${u.avatar}" class="rounded-full" style="width:36px;height:36px;object-fit:cover;" onerror="this.style.display='none'"><div style="flex:1;"><div class="font-medium">${u.name}</div><div class="text-xs text-muted">${u.email}</div></div><button class="btn btn-sm btn-outline" onclick="toast('Aprovado')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> Aprovar</button><button class="btn btn-sm btn-ghost" onclick="toast('Rejeitado','error')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg> Rejeitar</button></div>`).join("")}</div>`}</div></div>`;
}
document.addEventListener("DOMContentLoaded",()=>{renderSidebar();render();});
</script>
</body>
</html>
