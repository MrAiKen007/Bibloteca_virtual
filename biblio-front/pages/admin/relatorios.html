<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Admin — BIBLIO</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
<div class="sidebar-header"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><div class="sidebar-logo">BIBLIO</div><span class="text-xs uppercase text-muted">Admin</span></div>
<nav class="sidebar-nav">
<a href="./dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
<a href="./utilizadores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Utilizadores</a>
<a href="./relatorios.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg> Relatórios</a>
</nav>
<div class="sidebar-footer" id="sidebar-footer"></div>
</aside>
<main class="main-content"><div class="p-6" id="main"></div></main>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/app.js"></script>
<script>
function renderSidebar(){
const el=document.getElementById("sidebar-footer");
if(!el)return;
el.innerHTML=`<div class="sidebar-user"><img src="${currentUser?.avatar||''}" class="sidebar-user-avatar" onerror="this.style.display='none'"><div><div class="text-xs font-medium truncate">${currentUser?.name||''}</div><div class="text-xs text-muted truncate">${currentUser?.email||''}</div></div></div><a href="../catalogo.html" class="sidebar-nav" style="padding:0.25rem 0.5rem;margin-bottom:0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Voltar ao site</a><a href="#" class="sidebar-nav" style="padding:0.25rem 0.5rem;" onclick="handleLogout();return false;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Terminar sessão</a>`;
}
function render(){
document.getElementById("main").innerHTML=`<div class="space-y-6"><div><h1 class="font-display text-3xl font-bold">Relatórios</h1><p class="text-sm text-muted">Visão geral de vendas e utilizadores</p></div><div class="grid lg-grid-cols-2" style="gap:1.5rem;"><div class="card card-p-5"><h3 class="mb-3 font-semibold">Vendas por mês</h3><div style="height:260px;display:flex;align-items:flex-end;gap:8px;padding-top:20px;">${salesByMonth.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;background:var(--primary);border-radius:4px 4px 0 0;height:${(s.vendas/3500)*220}px;"></div><span class="text-xs text-muted">${s.month}</span></div>`).join("")}</div></div><div class="card card-p-5"><h3 class="mb-3 font-semibold">Livros mais comprados</h3><div style="height:260px;display:flex;align-items:flex-end;gap:8px;padding-top:20px;">${topSelling.map(s=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;background:var(--primary);border-radius:4px 4px 0 0;height:${(s.vendas/120)*220}px;"></div><span class="text-xs text-muted truncate" style="max-width:100%;text-align:center;">${s.titulo}</span></div>`).join("")}</div></div></div><div class="card card-p-5"><h3 class="mb-3 font-semibold">Resumo de pedidos</h3><table class="table"><thead><tr><th>ID</th><th>Data</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.id}</td><td>${formatDate(o.date)}</td><td>${users.find(u=>u.id===o.userId)?.name||o.userId}</td><td>${formatEUR(o.total)}</td><td><span class="badge ${o.status==="pago"?"badge-primary":""}">${o.status}</span></td></tr>`).join("")}</tbody></table></div></div>`;
}
document.addEventListener("DOMContentLoaded",()=>{renderSidebar();render();});
</script>
</body>
</html>
