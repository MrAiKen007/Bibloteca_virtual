<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livros — Backoffice — BIBLIO</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
<div class="sidebar-header"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><div class="sidebar-logo">BIBLIO</div><span class="text-xs uppercase text-muted">Backoffice</span></div>
<nav class="sidebar-nav">
<a href="./dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
<a href="./livros.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h10"/><path d="M6 20h12"/><path d="M6 16h12"/><path d="M5 2h14"/><path d="M6 2v18"/><path d="M18 2v18"/></svg> Livros</a>
<a href="./autores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Autores</a>
<a href="./editoras.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg> Editoras</a>
<a href="./taxonomias.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10h10V2z"/><path d="M12 12H2v10h10V12z"/><path d="M22 2h-10v10h10V2z"/><path d="M22 12h-10v10h10V12z"/></svg> Géneros & Tags</a>
</nav>
<div class="sidebar-footer" id="sidebar-footer"></div>
</aside>
<main class="main-content"><div class="p-6" id="main"></div></main>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/app.js"></script>
<script>
let q="",status="todos",tipo="todos";
function renderSidebar(){
const el=document.getElementById("sidebar-footer");
if(!el)return;
el.innerHTML=`<div class="sidebar-user"><img src="${currentUser?.avatar||''}" class="sidebar-user-avatar" onerror="this.style.display='none'"><div><div class="text-xs font-medium truncate">${currentUser?.name||''}</div><div class="text-xs text-muted truncate">${currentUser?.email||''}</div></div></div><a href="../catalogo.html" class="sidebar-nav" style="padding:0.25rem 0.5rem;margin-bottom:0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Voltar ao site</a><a href="#" class="sidebar-nav" style="padding:0.25rem 0.5rem;" onclick="handleLogout();return false;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Terminar sessão</a>`;
}
function render(){
const filtered=books.filter(b=>b.title.toLowerCase().includes(q.toLowerCase())&&(status==="todos"||b.status===status)&&(tipo==="todos"||b.access===tipo));
document.getElementById("main").innerHTML=`<div class="space-y-6"><div class="flex flex-wrap items-center justify-between gap-3"><h1 class="font-display text-3xl font-bold">Livros</h1><button class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg> Adicionar Livro</button></div><div class="card card-p"><div class="grid md-grid-cols-3" style="gap:0.75rem;"><input class="input" placeholder="Pesquisar título..." value="${q}" oninput="q=this.value;render()"><select class="input" onchange="status=this.value;render()"><option value="todos">Todos os estados</option><option value="publicado">Publicado</option><option value="rascunho">Rascunho</option><option value="arquivado">Arquivado</option></select><select class="input" onchange="tipo=this.value;render()"><option value="todos">Todos os tipos</option><option value="comprar">Comprar</option><option value="ler">Ler</option><option value="ambos">Ambos</option></select></div></div><div class="card p-0"><table class="table"><thead><tr><th class="w-16">Capa</th><th>Título</th><th>Autor</th><th>Estado</th><th>Tipo</th><th>Preço</th><th class="text-right">Ações</th></tr></thead><tbody>${filtered.map(b=>`<tr><td><img src="${b.cover}" style="width:36px;height:48px;object-fit:cover;border-radius:var(--radius);"></td><td class="font-medium">${b.title}</td><td>${getAuthor(b.authorId)?.name||""}</td><td><span class="badge ${b.status==="publicado"?"badge-primary":""}">${b.status}</span></td><td><span class="badge badge-outline">${b.access}</span></td><td>${formatAOA(b.price)}</td><td class="text-right"><div class="flex justify-end gap-1"><button class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button><button class="icon-btn" title="${b.status==="publicado"?"Despublicar":"Publicar"}">${b.status==="publicado"?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'}</button><button class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 7.5-2.7-2.7a2.12 2.12 0 0 0-3 0L9 11l-1 4 4-1 6.3-6.3a2.12 2.12 0 0 0 0-3Z"/><path d="M12 20h9"/><path d="M16 2v6"/><path d="M19 5h-6"/></svg></button></div></td></tr>`).join("")}</tbody></table></div></div>`;
}
document.addEventListener("DOMContentLoaded",()=>{renderSidebar();render();});
</script>
</body>
</html>
