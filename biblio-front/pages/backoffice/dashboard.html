<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backoffice Dashboard — BIBLIO</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
<div class="sidebar-header"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><div class="sidebar-logo">BIBLIO</div><span class="text-xs uppercase text-muted">Backoffice</span></div>
<nav class="sidebar-nav">
<a href="./dashboard.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</a>
<a href="./livros.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h10"/><path d="M6 20h12"/><path d="M6 16h12"/><path d="M5 2h14"/><path d="M6 2v18"/><path d="M18 2v18"/></svg> Livros</a>
<a href="./autores.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Autores</a>
<a href="./editoras.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg> Editoras</a>
<a href="./taxonomias.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10h10V2z"/><path d="M12 12H2v10h10V12z"/><path d="M22 2h-10v10h10V2z"/><path d="M22 12h-10v10h10V12z"/></svg> Géneros & Tags</a>
</nav>
<div class="sidebar-footer" id="sidebar-footer"></div>
</aside>
<main class="main-content"><div class="p-6" id="main"></div></main>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/app.js"></script>
<script>
function renderSidebar(){
const el=document.getElementById("sidebar-footer");
if(!el)return;
el.innerHTML=`<div class="sidebar-user"><img src="${currentUser?.avatar||''}" class="sidebar-user-avatar" onerror="this.style.display='none'"><div><div class="text-xs font-medium truncate">${currentUser?.name||''}</div><div class="text-xs text-muted truncate">${currentUser?.email||''}</div></div></div><a href="../catalogo.html" class="sidebar-nav" style="padding:0.25rem 0.5rem;margin-bottom:0.5rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Voltar ao site</a><a href="#" class="sidebar-nav" style="padding:0.25rem 0.5rem;" onclick="handleLogout();return false;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> Terminar sessão</a>`;
}
function render(){
const total=books.length;const publicados=books.filter(b=>b.status==="publicado").length;const rascunhos=books.filter(b=>b.status==="rascunho").length;const vendasMes=orders.reduce((s,o)=>s+o.total,0);const recent=[...books].sort((a,b)=>+new Date(b.createdAt)-+new Date(a.createdAt)).slice(0,5);
document.getElementById("main").innerHTML=`<div class="space-y-6"><div><h1 class="font-display text-3xl font-bold">Dashboard</h1><p class="text-sm text-muted">Resumo do backoffice</p></div><div class="grid md-grid-cols-2 lg-grid-cols-4" style="gap:1rem;"><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Livros cadastrados</div><div class="mt-2 font-display text-3xl font-bold">${total}</div><div class="mt-1 text-xs text-green-600">↑ 12% este mês</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h10"/><path d="M6 20h12"/><path d="M6 16h12"/><path d="M5 2h14"/><path d="M6 2v18"/><path d="M18 2v18"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Publicados</div><div class="mt-2 font-display text-3xl font-bold">${publicados}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Rascunhos</div><div class="mt-2 font-display text-3xl font-bold">${rascunhos}</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div></div></div><div class="card card-p-5"><div class="flex items-start justify-between"><div><div class="text-xs uppercase text-muted">Vendas do mês</div><div class="mt-2 font-display text-3xl font-bold">${formatEUR(vendasMes)}</div><div class="mt-1 text-xs text-green-600">↑ 8%</div></div><div class="rounded-md bg-secondary p-2 text-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div></div></div></div><div class="grid lg-grid-cols-2" style="gap:1.5rem;"><div class="card card-p-5"><h3 class="mb-3 font-semibold">Livros recentes</h3><table class="table"><thead><tr><th>Título</th><th>Autor</th><th>Estado</th></tr></thead><tbody>${recent.map(b=>`<tr><td class="font-medium">${b.title}</td><td>${getAuthor(b.authorId)?.name||""}</td><td><span class="badge ${b.status==="publicado"?"badge-primary":""}">${b.status}</span></td></tr>`).join("")}</tbody></table></div><div class="card card-p-5"><h3 class="mb-3 font-semibold">Vendas recentes</h3><table class="table"><thead><tr><th>Data</th><th>Livros</th><th>Total</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${formatDate(o.date)}</td><td class="truncate" style="max-width:260px;">${o.items.map(i=>getBook(i.bookId)?.title).join(", ")}</td><td>${formatEUR(o.total)}</td></tr>`).join("")}</tbody></table></div></div></div>`;
}
document.addEventListener("DOMContentLoaded",()=>{renderSidebar();render();});
</script>
</body>
</html>
