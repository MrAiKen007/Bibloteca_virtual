<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — BIBLIO</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header id="header" class="sticky-header"></header>
<div class="mobile-nav" id="mobile-nav" onclick="if(event.target===this)toggleMobileMenu()">
<div class="mobile-nav-panel"><nav><a href="./catalogo.html">Catálogo</a><a href="./biblioteca.html">Minha Biblioteca</a></nav></div>
</div>
<main class="container py-10" id="main"></main>
<footer id="footer"></footer>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
let method="cartao";
function render(){
const el=document.getElementById("main");
el.innerHTML=`<div class="grid lg-grid-cols-1fr-360" style="gap:2rem;"><div><h1 class="mb-6 font-display text-3xl font-bold">Pagamento</h1><div class="card card-p-5"><h3 class="mb-4 font-semibold">Método de pagamento</h3><div class="space-y-2"><label class="flex items-center gap-3 rounded border p-3 cursor-pointer"><input type="radio" name="pay" value="cartao" ${method==="cartao"?"checked":""} onchange="method='cartao';render()"> Cartão de crédito/débito</label><label class="flex items-center gap-3 rounded border p-3 cursor-pointer"><input type="radio" name="pay" value="mbway" ${method==="mbway"?"checked":""} onchange="method='mbway';render()"> MB WAY</label><label class="flex items-center gap-3 rounded border p-3 cursor-pointer"><input type="radio" name="pay" value="paypal" ${method==="paypal"?"checked":""} onchange="method='paypal';render()"> PayPal</label></div>${method==="cartao"?`<div class="grid sm-grid-cols-2 mt-5" style="gap:1rem;"><div class="col-span-2"><label class="label">Número do cartão</label><input class="input" placeholder="•••• •••• •••• ••••"></div><div><label class="label">Validade</label><input class="input" placeholder="MM/AA"></div><div><label class="label">CVV</label><input class="input" placeholder="123"></div><div class="col-span-2"><label class="label">Nome no cartão</label><input class="input"></div></div>`:method==="mbway"?`<div class="mt-5"><label class="label">Telemóvel</label><input class="input" placeholder="9XX XXX XXX"></div>`:`<div class="mt-5"><label class="label">Email PayPal</label><input class="input" type="email"></div>`}</div></div><div class="card h-fit card-p-5"><h3 class="font-semibold">Resumo do pedido</h3><div class="mt-3 space-y-2 text-sm">${cartItems.map(i=>{const b=getBook(i.bookId);return b?`<div class="flex justify-between"><span class="truncate" style="padding-right:0.5rem;">${b.title}</span><span>${formatAOA(b.price)}</span></div>`:"";}).join("")}</div><div class="mt-3 flex justify-between border-t pt-3 font-semibold"><span>Total</span><span class="text-primary">${formatAOA(cartSubtotal())}</span></div><button class="btn btn-w-full mt-5" onclick="cartPurchase();toast('Compra realizada com sucesso!');location.href='./sucesso.html';">Confirmar Pagamento</button></div></div>`;
}
document.addEventListener("DOMContentLoaded",render);
</script>
</body>
</html>
