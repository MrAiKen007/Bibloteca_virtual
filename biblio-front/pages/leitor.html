<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor — BIBLIO</title>
<link rel="stylesheet" href="../css/styles.css">
<style>iframe{width:100%;height:80vh;border:none;border-radius:var(--radius);}</style>
</head>
<body>
<header id="header" class="sticky-header"></header>
<main class="container py-10" id="main"></main>
<footer id="footer"></footer>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
function render(){
const params=new URLSearchParams(location.search);
const id=params.get("id");
const book=getBook(id);
if(!book){document.getElementById("main").innerHTML=`<div class="container py-20 text-center"><h1 class="text-2xl">Livro não encontrado</h1></div>`;return;}
document.getElementById("main").innerHTML=`<div class="flex items-center justify-between mb-6"><h1 class="font-display text-3xl font-bold">${book.title}</h1><a href="./biblioteca.html" class="btn btn-sm btn-outline">Voltar à biblioteca</a></div><div class="card card-p"><iframe src="${book.pdfUrl}"></iframe></div>`;
}
document.addEventListener("DOMContentLoaded",render);
</script>
</body>
</html>
